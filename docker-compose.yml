version: '3.8'

services:
  bust-extractor:
    build: .
    image: bust-extractor:latest
    container_name: bust-extractor
    restart: "no"  # Do not restart automatically
    volumes:
      # Mount current directory as input
      - ./:/input:ro
      # Mount output directory
      - ./output:/output
    # Default command - can be overridden
    command: ["--help"]
    
    # Optional: For AI background removal, uncomment this to use GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
